<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #007BFF;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
        nav {
            margin: 20px 0;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }
        h1, h2 {
            margin: 20px 0;
        }
        .content {
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <header>
        <h1>欢迎来到我的网站</h1>
        <nav>
            <a href="#">首页</a>
            <a href="#">关于我们</a>
            <a href="#">服务</a>
            <a href="#">联系方式</a>
        </nav>
    </header>

    <div class="container">
        <section class="content">
            <h2>关于我们</h2>
            <p>这是一个简单而美观的网页设计示例，您可以根据需要进行修改和增强。我们的目标是提供最佳的服务与体验。</p>
        </section>
        
        <section class="content">
            <h2>我们的服务</h2>
            <p>我们提供多种服务，包括网站设计、开发和维护。请联系我们以了解更多信息。</p>
        </section>
    </div>

    <footer>
        <p>&copy; 2025 我的公司名称. 版权所有.</p>
    </footer>
</body>
</html>
